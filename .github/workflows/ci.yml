name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/memes.mjs
          node --check test/plugin.test.mjs
      - name: Plugin test
        run: node test/plugin.test.mjs
